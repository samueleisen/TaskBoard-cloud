name: Continuous Deployment (GCP VM)

# Trigger deployment automatically on every push to main
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GCP Compute Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          envs: GITHUB_TOKEN
          script_stop: true
          script: |
            echo "🚀 [Deploy] Navigating to ~/CloudZero..."
            cd ~/CloudZero

            echo "🔄 [Deploy] Reconciling git remote origin..."
            git remote set-url origin https://github.com/syamilhi/CloudZero.git 2>/dev/null || true

            echo "📥 [Deploy] Fetching latest code with authenticated token..."
            git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/syamilhi/CloudZero.git main
            git reset --hard FETCH_HEAD

            echo "📦 [Deploy] Synchronizing npm dependencies..."
            npm install

            echo "🔨 [Deploy] Compiling client and server bundles..."
            npm run build

            echo "🔄 [Deploy] Reloading PM2 process cloudzero..."
            pm2 restart cloudzero || pm2 start server/dist/index.js --name cloudzero

            echo "🏥 [Deploy] Verifying health check probe..."
            sleep 2
            curl -fail http://localhost:8080/health || { echo "❌ Health check failed!"; exit 1; }

            echo "✅ [Deploy] Deployment completed successfully!"

