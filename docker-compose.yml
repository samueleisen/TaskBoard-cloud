version: '3.8'

services:
  # PostgreSQL Database Service (Postgres 16)
  postgres:
    image: postgres:16-alpine
    container_name: taskboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskboard_dev
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TaskBoard Application (Server + Client in Unified Container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskboard-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://taskboard:taskboard_secret@postgres:5432/taskboard_dev
      JWT_SECRET: local-docker-compose-jwt-secret-key-32-chars
    ports:
      - "8080:8080"

volumes:
  postgres_data:
